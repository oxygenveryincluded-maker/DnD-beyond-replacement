name: Keep Supabase alive

# Free-plan Supabase projects pause after ~7 days without database activity.
# This pings the project twice a week so the cloud save keeps working.
#
# One-time setup: run supabase/keepalive.sql in the Supabase SQL editor.
# The anon key below is public (it ships in the frontend bundle), so it is
# safe to keep in this file.
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity. If you won't push for a while, add the same URL to a free external
# cron (e.g. cron-job.org or UptimeRobot) as a belt-and-braces ping.

on:
  schedule:
    # Every 2 days at 06:17 UTC.
    - cron: '17 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://dnlbufxvujuebkzxqnub.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_GRxdAkEXO1NN9Kjd1bjZag_uhNRA0KC
        run: |
          set -euo pipefail

          # Preferred: the keep_alive() RPC (real database query).
          status=$(curl -sS -o /tmp/ping.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "rpc keep_alive -> HTTP $status"
          cat /tmp/ping.json || true

          if [ "$status" = "200" ]; then
            exit 0
          fi

          # Fallback for projects where keepalive.sql hasn't been run yet:
          # a plain (RLS-filtered) read still counts as database activity.
          status=$(curl -sS -o /tmp/ping2.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/user_data?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "select user_data -> HTTP $status"
          cat /tmp/ping2.json || true

          if [ "$status" != "200" ]; then
            echo "::error::Supabase ping failed (HTTP $status). The project may be paused — resume it in the Supabase dashboard."
            exit 1
          fi
